spring.application.name=mindurcode

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/mindurcode
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
# Was true — turned off because the 5-second polling endpoint was firing
# 36+ queries per tick and flooding the console / adding noticeable latency.
# Re-enable temporarily (and only temporarily) if you need to debug SQL.
spring.jpa.show-sql=false
# Release the DB connection after each query instead of holding it for the
# whole HTTP request. Critical when /api/analysis/run blocks on Ollama for
# minutes per method — otherwise the pool drains and unrelated requests 500.
spring.jpa.open-in-view=false

# HikariCP — bump pool size for demo concurrency (parallel tool runs + repo
# list refresh + tool-page restores all happening at once). Fail fast (10s)
# so the frontend gets an error instead of waiting 30s.
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.connection-timeout=10000

# Ollama
ollama.base-url=http://192.168.88.122:11434
ollama.model=qwen2.5-coder:7b
